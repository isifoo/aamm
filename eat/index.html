<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eat</title>
<meta name="description" content="Every restaurant in your NYC neighborhood, filtered by rating, picked by slot machine.">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eat">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --soft:#f1ebe2; --ink:#1c1a17; --dim:#787068; --line:#e8e0d4;
  --accent:#ff4d2e; --gold:#f2a516; --good:#1f9d55;
  --shadow:0 1px 2px rgba(50,35,20,.05),0 4px 14px rgba(50,35,20,.06);
  --r:16px; --ease:cubic-bezier(.23,1,.32,1);
  --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131210; --card:#1e1c19; --soft:#2a2723; --ink:#f3eee8; --dim:#a29a90; --line:#302c27;
    --accent:#ff6a4d; --gold:#ffbb3d; --good:#3fcf7f; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--font);overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 100px)}
svg{display:block}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:4px 0 10px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1.2px;line-height:1;margin:0}
.logo span{color:var(--accent)}
.zone{display:inline-flex;align-items:center;gap:3px;margin-top:3px;font-size:13px;font-weight:600;color:var(--dim)}
.zone svg{width:14px;height:14px}
.sp{flex:1}
.tbtn{height:36px;min-width:36px;padding:0 10px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.tbtn svg{width:18px;height:18px}
.tbtn.on{background:var(--accent);color:#fff;box-shadow:none}

/* banner */
.banner{background:var(--card);border-radius:var(--r);padding:11px 13px;margin-bottom:10px;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.banner b{display:block;margin-bottom:2px;font-size:14px}
.banner .x{margin-left:auto;color:var(--dim);font-size:20px;line-height:1}
.banner.err{box-shadow:inset 0 0 0 1.5px var(--accent)}
.banner .mini{margin-top:8px;height:32px;padding:0 12px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px}
.progress{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}

/* slot machine (collapsible) */
.slotwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease),opacity .25s;margin-bottom:12px}
.slotwrap.closed{grid-template-rows:0fr;opacity:0;margin-bottom:0}
.slotwrap>div{overflow:hidden;min-height:0}
.slot{border-radius:18px;padding:10px;background:linear-gradient(150deg,#ff5a36,#ff2d55);color:#fff;display:flex;gap:10px;align-items:stretch}
.reel-win{position:relative;flex:1;height:114px;border-radius:12px;background:var(--card);overflow:hidden}
.reel-win::before,.reel-win::after{content:"";position:absolute;left:0;right:0;height:38px;z-index:2;pointer-events:none}
.reel-win::before{top:0;background:linear-gradient(var(--card),transparent)}
.reel-win::after{bottom:0;background:linear-gradient(transparent,var(--card))}
.reel{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel div{height:38px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap}
.reel div em{font-style:normal;font-size:20px}
.payline{position:absolute;left:6px;right:6px;top:38px;height:38px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--gold);z-index:3;pointer-events:none}
.slot.won .payline{animation:win .8s var(--ease)}
@keyframes win{30%{transform:scale(1.05);box-shadow:inset 0 0 0 2px var(--gold),0 0 16px var(--gold)}}
.slot-side{width:108px;display:flex;flex-direction:column;gap:8px}
.spin{flex:1;border-radius:12px;background:#fff;color:#ff3b30;font-weight:800;font-size:16px;letter-spacing:1.5px;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .12s var(--ease),box-shadow .12s}
.spin:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.ghost{height:38px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.ghost:disabled,.spin:disabled{opacity:.5}
.slot-result{font-size:12px;font-weight:700;text-align:center;opacity:.95;min-height:15px}

/* toolbar */
.bar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);padding:0 12px}
.search svg{width:17px;height:17px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:none}
.seg button{width:36px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim)}
.seg button svg{width:18px;height:18px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.row-scroll{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px 8px;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 11px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip small{color:var(--dim);font-weight:600;font-size:11.5px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.on small{color:inherit;opacity:.7}
.chip.star{color:var(--dim)}
.chip.star.on{color:var(--bg)}
.tabs{display:flex;gap:18px;overflow-x:auto;margin:2px 0 6px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 0;font-size:14px;font-weight:700;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.listhead{display:flex;align-items:center;gap:10px;margin:8px 2px 10px;font-size:12.5px;color:var(--dim)}
.listhead .sync{display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:12.5px}
.listhead .sync svg{width:13px;height:13px}
.listhead .sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.listhead select{margin-left:auto;border:0;background:transparent;font-weight:700;color:var(--ink);font-size:12.5px;text-align:right}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:11px;align-items:center;background:var(--card);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .15s var(--ease)}
.card:active,.tile:active{transform:scale(.98)}
.emo{flex:none;width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:24px}
.body{flex:1;min-width:0}
.body h3{margin:0 0 2px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{color:var(--good);font-weight:700}
.closed{color:var(--accent);font-weight:700}
.tags{display:flex;gap:5px;margin-top:4px;font-size:11px;flex-wrap:wrap}
.tags span{padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--dim);font-weight:700}
.tags .me{background:rgba(242,165,22,.16);color:#a76800}
@media (prefers-color-scheme: dark){.tags .me,.tile .mk{color:var(--gold)!important}}
.score{flex:none;text-align:right}
.score b{display:block;font-size:16px;font-weight:800}
.score b i,.tile .r i{font-style:normal;color:var(--gold)}
.score small{font-size:11.5px;color:var(--dim)}

/* grid */
.list.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.list.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);min-height:150px;transition:transform .15s var(--ease)}
.tile .big{font-size:34px;line-height:1;margin-bottom:10px}
.tile h3{margin:0 0 4px;font-size:14.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{white-space:normal}
.tile .r{margin-top:auto;padding-top:8px;font-size:14px;font-weight:800;display:flex;align-items:baseline;gap:5px}
.tile .r small{font-weight:600;color:var(--dim);font-size:11.5px}
.tile .mk{position:absolute;top:10px;right:10px;font-size:12px;font-weight:800;color:#a76800}
.list.grid .empty,.list.grid .more{grid-column:1/-1}

.empty{text-align:center;color:var(--dim);padding:36px 20px}
.empty b{display:block;font-size:36px;margin-bottom:6px}
.empty .mini{margin-top:12px;height:38px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700}
.more{width:100%;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;margin-top:4px}

/* map */
#map{height:calc(100dvh - 300px);min-height:340px;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--soft);z-index:0}
.mapnote{font-size:12.5px;color:var(--dim);margin-top:8px;text-align:center}
.pinwrap{background:none;border:0}
.pin{position:absolute;transform:translate(-50%,-100%);margin-top:-6px;display:flex;align-items:center;gap:3px;padding:3px 7px 3px 4px;border-radius:99px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.25);font:800 12px var(--font);color:var(--ink);white-space:nowrap}
.pin::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:inherit;transform:translateX(-50%) rotate(45deg);z-index:-1;border-radius:2px}
.pin i{font-style:normal;font-size:16px}
.pin.me{background:var(--accent);color:#fff}
.pin b{font-weight:800}
#map.far .pin{padding:2px;margin-top:-4px}
#map.far .pin b{display:none}
#map.far .pin i{font-size:14px}
.leaflet-control-attribution{font:10px var(--font)!important}
#map .leaflet-tile-pane{filter:saturate(.75) contrast(.95)}
@media (prefers-color-scheme: dark){#map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)}#map{background:#1b1a18}}

.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(var(--safe-b) + 18px);width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30;transition:transform .15s var(--ease)}
.fab:active{transform:scale(.92)}
.fab svg{width:24px;height:24px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:1000}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 16px calc(var(--safe-b) + 20px);z-index:1001;transform:translateY(105%);transition:transform .36s var(--ease);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 3px;font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:14px}
.pickflag{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:99px;margin-bottom:8px;letter-spacing:.4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:9px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px;font-weight:800}
.stat small{font-size:11.5px;color:var(--dim)}
.btns{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;height:44px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5}
.section{background:var(--card);border-radius:var(--r);padding:13px;box-shadow:var(--shadow);margin-bottom:10px}
.section h4{margin:0 0 9px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
.stars{display:flex;gap:4px}
.stars button{font-size:32px;line-height:1;color:var(--line);transition:transform .15s var(--ease),color .15s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.25)}
.toggles{display:flex;gap:8px;margin-top:10px}
.toggle{flex:1;height:38px;border-radius:11px;background:var(--soft);font-weight:700;font-size:13.5px;color:var(--dim)}
.toggle.on{background:var(--ink);color:var(--bg)}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin:0 0 5px}
.in{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;outline:0;margin-bottom:12px}
.in:focus{border-color:var(--accent)}
textarea.in{height:80px;padding:10px 12px;resize:vertical}
select.in{-webkit-appearance:none;appearance:none}
.hint{font-size:12.5px;color:var(--dim);margin:-4px 0 12px;line-height:1.45}
.results{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.results button{text-align:left;background:var(--soft);border-radius:12px;padding:9px 12px;font-size:13.5px}
.results button b{display:block}
.results button.on{box-shadow:inset 0 0 0 2px var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pills button{height:34px;padding:0 11px;border-radius:10px;background:var(--soft);font-weight:700;font-size:13px;color:var(--dim)}
.pills button.on{background:var(--ink);color:var(--bg)}
.pills.skip button.on{background:var(--accent);color:#fff;text-decoration:line-through}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:600;padding:3px 0}
.switchrow small{display:block;color:var(--dim);font-weight:400;font-size:12.5px}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.zlist{display:flex;flex-direction:column;gap:6px}
.zlist h5{margin:10px 2px 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
.zitem{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--card);box-shadow:var(--shadow);border-radius:13px;padding:11px 13px;font-weight:700}
.zitem small{font-weight:500;color:var(--dim);font-size:12px;white-space:nowrap}
.zitem.on{box-shadow:inset 0 0 0 2px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 88px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:99px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:1100;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="logo">eat<span>.</span></h1>
      <button class="zone" id="zoneBtn" aria-label="Change neighborhood"><span id="zoneName"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="sp"></div>
    <button class="tbtn" id="slotToggle" aria-label="Slot machine" aria-pressed="false">🎰</button>
    <button class="tbtn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <div id="banner"></div>

  <div class="slotwrap closed" id="slotWrap"><div>
    <section class="slot" id="slot">
      <div class="reel-win"><div class="reel" id="reel"></div><div class="payline"></div></div>
      <div class="slot-side">
        <button class="spin" id="spinBtn">SPIN</button>
        <button class="ghost" id="pickBtn" disabled>Pick a spot</button>
        <div class="slot-result" id="slotResult"></div>
      </div>
    </section>
  </div></div>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" name="eat-place-filter" placeholder="Search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="seg" id="layout">
      <button data-l="list" aria-label="List view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
      <button data-l="grid" aria-label="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
      <button data-l="map" aria-label="Map view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m9 4-5 2v14l5-2 6 2 5-2V4l-5 2-6-2zM9 4v14M15 6v14"/></svg></button>
    </div>
  </div>

  <div class="row-scroll" id="presets"></div>
  <div class="row-scroll" id="chips"></div>

  <div class="tabs" id="views">
    <button data-v="all">All</button>
    <button data-v="fav">Saved</button>
    <button data-v="been">Been</button>
    <button data-v="todo">Not yet</button>
    <button data-v="mine">Added</button>
  </div>

  <div class="listhead">
    <span id="count"></span>
    <button class="sync" id="syncBtn" aria-label="Refresh from Google Maps">

/* ---------------- helpers ---------------- */

const ago = t => { if (!t) return ''; const m = (Date.now()-t)/6e4; if (m<1) return 'just now'; if (m<60) return Math.round(m)+'m ago'; const h=m/60; if (h<24) return Math.round(h)+'h ago'; return Math.round(h/24)+'d ago'; };

  const list = [primary, ...(types||[])].filter(Boolean);
  for (const t of list) for (const [re, g] of TYPE_MAP) if (re.test(t)) return g;
  return 'other';
}
const genreOf = p => me(p.id).genre || p.genre || 'other';
const genreInfo = g => GENRES[g] || [String(g).replace(/(^|_)\w/g, m => m.replace('_',' ').toUpperCase()), '🍽️'];
function score(p){ const mr = me(p.id).rating; if (D.s.useMine && mr) return mr; return p.rating ?? mr ?? null; }

/* ---------------- filtering ---------------- */
function baseList(){
  const min = +D.s.minRating, qq = norm(q), v = D.s.view, skip = new Set(D.s.skipGenres);
  return Object.values(P()).filter(p => {
    const m = me(p.id), g = genreOf(p);
    if (skip.has(g)) return false;
    if (m.hidden && !D.s.showHidden) return false;
    if (v === 'fav' && !m.fav) return false;
    if (v === 'been' && !m.been) return false;
    if (v === 'todo' && m.been) return false;
    if (v === 'mine' && p.source !== 'mine') return false;
    if (min > 0) { const s = score(p); if (s == null || s < min) return false; }
    if (qq && !norm(p.name + p.address + genreInfo(g)[0] + (m.note||'')).includes(qq)) return false;
    return true;
  });
}
function filtered(){
  const g = D.s.genre, list = baseList().filter(p => !g || genreOf(p) === g);
  const by = D.s.sort, sc = p => score(p) ?? 0, rc = p => p.userRatingCount || 0;
  list.sort((a,b) => {
    if (by === 'name') return a.name.localeCompare(b.name);
    if (by === 'reviews') return rc(b) - rc(a);
    if (by === 'mine') return (me(b.id).rating||0) - (me(a.id).rating||0) || sc(b) - sc(a);
    if (by === 'smart') { const w = p => { const n = rc(p) || (me(p.id).rating ? 5 : 0); return (sc(p)*n + 4.2*50)/(n+50); }; return w(b) - w(a); }

  });
  return list;
}
function genreCounts(){
  const c = {};
  baseList().forEach(p => { const g = genreOf(p); c[g] = (c[g]||0) + 1; });
  return Object.entries(c).sort((a,b) => b[1]-a[1]);
}

async function renderMap(list){

/* ---------------- slot machine ---------------- */
const H = 38;
let reelGenres = [], reelPos = 0, spinning = false;
const hash = s => { let h = 7; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return h; };
function buildReel(){
  if (spinning) return;
  const reel = $('#reel');
  reelGenres = genreCounts().map(([g]) => g).sort((a,b) => hash(a) - hash(b));
  if (!reelGenres.length) { reel.innerHTML = `<div style="transform:translateY(${H}px)">No places</div>`; reel.style.transform=''; $('#pickBtn').disabled = true; return; }
  const n = reelGenres.length;
  reel.innerHTML = Array.from({length:14}, () => reelGenres.map(g => { const [l,e] = genreInfo(g); return `<div><em>${e}</em>${esc(l)}</div>`; }).join('')).join('');
  let idx = D.s.genre ? reelGenres.indexOf(D.s.genre) : 0; if (idx < 0) idx = 0;
  reelPos = n + idx;
  reel.style.transition = 'none';
  reel.style.transform = `translateY(${-(reelPos-1)*H}px)`;
  $('#pickBtn').disabled = !filtered().length;
}
function spin(){
  if (spinning || !reelGenres.length) return;
  const n = reelGenres.length, reel = $('#reel'), slot = $('#slot');
  let target = Math.floor(Math.random() * n);
  if (n > 1 && reelGenres[target] === D.s.genre) target = (target + 1 + Math.floor(Math.random()*(n-1))) % n;
  const finalIdx = n * 11 + target;
  spinning = true; $('#spinBtn').disabled = true; slot.classList.remove('won');
  $('#slotResult').textContent = '';
  reel.style.transition = 'none';
  reel.style.transform = `translateY(${-(reelPos-1)*H}px)`;
  void reel.offsetHeight;
  const dur = 2400 + Math.random()*600;
  reel.style.transition = `transform ${dur}ms cubic-bezier(.12,.75,.12,1)`;
  reel.style.transform = `translateY(${-(finalIdx-1)*H}px)`;
  setTimeout(() => {
    spinning = false; $('#spinBtn').disabled = false; slot.classList.add('won');
    if (navigator.vibrate) navigator.vibrate([30,40,60]);
    D.s.genre = reelGenres[target]; save(); shown = 60;
    reelPos = n + target;
    reel.style.transition = 'none';
    reel.style.transform = `translateY(${-(reelPos-1)*H}px)`;
    renderChips(); renderList();
    const n2 = filtered().length;
    $('#slotResult').textContent = `${n2} spot${n2===1?'':'s'}`;
    $('#pickBtn').disabled = !n2;
  }, dur + 40);
}
function pickOne(){
  const list = filtered(); if (!list.length) return;
  const pool = list.length > 1 && lastPickId ? list.filter(p => p.id !== lastPickId) : list;
  const p = pool[Math.floor(Math.random() * pool.length)];
  lastPickId = p.id;
  openDetail(p.id, true);
}

}

/* ---------------- Google Places sync ---------------- */
async function searchText(textQuery, bounds, pageToken, restrict = true){
  const body = { textQuery, pageSize:20 };
  if (bounds) body[restrict ? 'locationRestriction' : 'locationBias'] = { rectangle: bounds };
  if (pageToken) body.pageToken = pageToken;
  let res;
  try {
    res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Goog-Api-Key':D.s.key, 'X-Goog-FieldMask':FIELDS }, body:JSON.stringify(body)
    });
  } catch { throw new Error('No connection to Google Maps'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(explainGoogleError(j.error, res.status));
  return j;
}
function explainGoogleError(err, status){
  const msg = err?.message || `Google Maps error ${status}`;
  const reason = (err?.details || []).map(d => d.reason).find(Boolean) || '';
  const t = reason + ' ' + msg;
  const tip =
    /SERVICE_BLOCKED|are blocked/i.test(t) ? 'Fix: in Google Cloud → Credentials → your API key → API restrictions, tick “Places API (New)” (it is separate from “Places API”), save, and wait a minute.' :
    /REFERRER|referer/i.test(t) ? `Fix: in your API key's Website restrictions, add ${location.origin}/* and save.` :
    /SERVICE_DISABLED|has not been used|is disabled/i.test(t) ? 'Fix: enable “Places API (New)” in this Google Cloud project, then wait a minute.' :
    /BILLING/i.test(t) ? 'Fix: link a billing account to this Google Cloud project.' :
    /API_KEY_INVALID|key not valid/i.test(t) ? 'Fix: the key looks wrong. Copy it again from Google Cloud → Credentials.' : '';
  return tip ? `${msg} ${tip}` : msg;
}
function fromGoogle(g){
  if (!g || !g.id || g.businessStatus === 'CLOSED_PERMANENTLY') return null;
  const types = g.types || [];
  if (!FOOD_TYPES.test([g.primaryType, ...types].join(' '))) return null;
  return {
    id:g.id, name:g.displayName?.text || 'Unnamed', address:g.formattedAddress || '',
    rating:g.rating ?? null, userRatingCount:g.userRatingCount || 0, priceLevel:g.priceLevel, primaryType:g.primaryType,
    genre:genreFromTypes(g.primaryType, types), googleMapsUri:g.googleMapsUri,
    location:g.location, openNow:g.currentOpeningHours?.openNow, source:'google', updated:Date.now()
  };
}
function setProgress(name, label, frac, found){
  $('#banner').innerHTML = `<div class="banner"><div style="flex:1"><b>Scanning ${esc(name)}…</b>${esc(label)} · ${found} places<div class="progress"><i style="width:${Math.round(frac*100)}%"></i></div></div></div>`;
}
async function runSync(manual){
  if (syncing || !D.s.key) return;
  const zk = D.s.zone, zi = zoneInfo(zk), zd = Z(zk);
  if (!zi.b) { toast('Pick a neighborhood first'); return; }
  syncing = true; renderSync();
  const found = {};
  try {
    for (let i = 0; i < QUERIES.length; i++) {
      let token = null, page = 0;
      do {
        setProgress(zi.name, QUERIES[i], i / QUERIES.length, Object.keys(found).length);
        const r = await searchText(QUERIES[i], zi.b, token);
        (r.places || []).forEach(g => { const p = fromGoogle(g); if (p) found[p.id] = p; });
        token = r.nextPageToken; page++;
      } while (token && page < 3);
    }
    const ids = Object.keys(found);
    if (!ids.length) throw new Error('Google returned no places for this area.');
    // starter places: move your ratings onto the matching Google place; keep ones you touched that have no match
    const byName = {}; ids.forEach(id => { byName[norm(found[id].name)] = id; });
    Object.values(zd.places).filter(p => p.source === 'starter').forEach(p => {
      const gid = byName[norm(p.name)], m = D.mine[p.id], used = m && (m.rating || m.fav || m.been || m.note || m.genre);
      if (gid) { if (m) D.mine[gid] = Object.assign({}, m, D.mine[gid]); delete D.mine[p.id]; delete zd.places[p.id]; }
      else if (used) p.source = 'mine';
      else { delete D.mine[p.id]; delete zd.places[p.id]; }
    });
    ids.forEach(id => { zd.places[id] = Object.assign({}, zd.places[id], found[id]); delete zd.places[id].missed; });
    // drop Google places missing from 3 scans in a row, unless you rated, saved or noted them
    Object.values(zd.places).forEach(p => {
      if (p.source !== 'google' || found[p.id]) return;
      p.missed = (p.missed || 0) + 1;
      const m = D.mine[p.id];
      if (p.missed >= 3 && !(m && (m.rating || m.fav || m.note))) delete zd.places[p.id];
    });
    zd.lastSync = Date.now();
    if (D.s.genre && !Object.values(zd.places).some(p => genreOf(p) === D.s.genre)) D.s.genre = '';
    save();
    toast(`${ids.length} ${zi.name} spots loaded`);
  } catch (err) {
    syncing = false;
    $('#banner').innerHTML = `<div class="banner err"><div><b>Scan stopped</b>${esc(err.message)}</div><button class="x" data-act="clearbanner" aria-label="Dismiss">×</button></div>`;
    renderSync();
    if (manual) toast('Scan failed');
    return;
  }
  syncing = false; $('#banner').innerHTML = ''; shown = 60; renderAll();
}
function maybeAutoSync(){
  const z = Z();
  if (!D.s.key || !D.s.autoDays || syncing || !z.lastSync) return; // a neighborhood's first scan is always your choice
  if (Date.now() - z.lastSync > D.s.autoDays * 864e5) runSync(false);
}

/* ---------------- events ---------------- */
$('#presets').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; D.s.minRating = +b.dataset.r; shown = 60; save(); renderPresets(); renderChips(); renderList(); buildReel(); };
$('#q').addEventListener('input', e => { q = e.target.value; shown = 60; renderChips(); renderList(); clearTimeout(buildReel.t); buildReel.t = setTimeout(buildReel, 300); });
$('#chips').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; D.s.genre = D.s.genre === b.dataset.g ? '' : b.dataset.g; shown = 60; save(); $('#slotResult').textContent=''; renderChips(); renderList(); buildReel(); };
$('#views').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; D.s.view = b.dataset.v; shown = 60; save(); renderTop(); renderChips(); renderList(); buildReel(); };
$('#layout').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; D.s.layout = b.dataset.l; shown = 60; save(); renderTop(); renderList(); };
$('#sort').onchange = e => { D.s.sort = e.target.value; save(); renderList(); };
$('#slotToggle').onclick = () => { D.s.slotOpen = !D.s.slotOpen; save(); renderTop(); if (D.s.slotOpen) buildReel(); };
function onAct(a){
  if (a === 'settings') openSettings();
  else if (a === 'scan') runSync(true);
  else if (a === 'dismiss') { D.s.dismissIntro = true; save(); renderBanner(); }
  else if (a === 'clearbanner') { $('#banner').innerHTML = ''; renderBanner(); }
  else if (a === 'clear') { q = ''; $('#q').value = ''; D.s.genre = ''; D.s.view = 'all'; D.s.minRating = 0; save(); renderAll(); }
}
$('#list').onclick = e => {
  if (e.target.id === 'more') { shown += 60; renderList(); return; }
  const a = e.target.closest('[data-act]'); if (a) { onAct(a.dataset.act); return; }
  const c = e.target.closest('[data-id]'); if (c) openDetail(c.dataset.id);
};
$('#banner').onclick = e => { const a = e.target.closest('[data-act]'); if (a) onAct(a.dataset.act); };
$('#spinBtn').onclick = spin;
$('#pickBtn').onclick = pickOne;
$('#addBtn').onclick = openAdd;
$('#openSettings').onclick = openSettings;
$('#zoneBtn').onclick = openZones;
$('#syncBtn').onclick = () => D.s.key ? runSync(true) : openSettings();
$('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderSync(); maybeAutoSync(); } });
setInterval(renderSync, 60000);

// init
$('#q').value = ''; q = '';
window.addEventListener('pageshow', () => { if ($('#q').value !== q) { $('#q').value = ''; q = ''; renderList(); } });
renderAll();
maybeAutoSync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
