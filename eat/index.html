<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>eat</title>
<meta name="description" content="Every Williamsburg restaurant, filtered by rating, picked by slot machine.">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="eat">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#faf6f0; --card:#ffffff; --card2:#f3ece2; --ink:#1d1a17; --dim:#7a7068; --line:#ebe2d6;
  --accent:#ff4d2e; --accent-ink:#ffffff; --gold:#f5a524; --good:#1f9d55; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
  --r:18px; --ease:cubic-bezier(.23,1,.32,1);
  --font:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --card:#1f1c19; --card2:#2a2622; --ink:#f4efe9; --dim:#a39a90; --line:#322d28;
    --accent:#ff6a4d; --gold:#ffbd45; --good:#3fcf7f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --card:#1f1c19; --card2:#2a2622; --ink:#f4efe9; --dim:#a39a90; --line:#322d28;
  --accent:#ff6a4d; --gold:#ffbd45; --good:#3fcf7f; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 110px)}

/* header */
header{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.logo{font-size:40px;font-weight:900;letter-spacing:-2px;line-height:1;margin:0}
.logo span{color:var(--accent)}
.where{font-size:13px;color:var(--dim);margin-top:2px;white-space:nowrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--dim);white-space:nowrap}
.pill svg{width:16px;height:16px}
.pill.busy svg{animation:spin 1s linear infinite}
.iconbtn{width:38px;height:38px;border-radius:99px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* banner */
.banner{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.banner b{display:block;margin-bottom:2px}
.banner .x{margin-left:auto;color:var(--dim);font-size:20px;line-height:1}
.banner.err{border:1px solid var(--accent)}
.progress{height:4px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s var(--ease)}

/* slot machine */
.slot{position:relative;border-radius:24px;padding:14px;background:linear-gradient(160deg,#ff5a36,#ff2d55);color:#fff;box-shadow:0 10px 30px rgba(255,60,50,.28);margin-bottom:16px;overflow:hidden}
.slot::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.slot-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:15px;letter-spacing:.3px;margin:0 2px 10px;position:relative}
.slot-top small{font-weight:600;opacity:.85;font-size:12px}
.reel-win{position:relative;height:168px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:inset 0 4px 12px rgba(0,0,0,.18)}
:root[data-theme="dark"] .reel-win{background:#211d1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .reel-win{background:#211d1a}}
.reel-win::before,.reel-win::after{content:"";position:absolute;left:0;right:0;height:56px;z-index:2;pointer-events:none}
.reel-win::before{top:0;background:linear-gradient(var(--card),transparent)}
.reel-win::after{bottom:0;background:linear-gradient(transparent,var(--card))}
.reel{position:absolute;left:0;right:0;top:0;will-change:transform}
.reel div{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:800;color:var(--ink);white-space:nowrap}
.reel div em{font-style:normal;font-size:28px}
.payline{position:absolute;left:8px;right:8px;top:56px;height:56px;border-radius:12px;border:2.5px solid var(--gold);z-index:3;pointer-events:none}
.slot.won .payline{animation:win .9s var(--ease)}
@keyframes win{0%,100%{transform:scale(1)}30%{transform:scale(1.06);box-shadow:0 0 22px var(--gold)}}
.slot-actions{display:flex;gap:10px;margin-top:12px;position:relative}
.spin{flex:1.3;height:52px;border-radius:16px;background:#fff;color:#ff3b30;font-weight:900;font-size:19px;letter-spacing:2px;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .12s var(--ease),box-shadow .12s}
.spin:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.spin:disabled{opacity:.7}
.ghost{flex:1;height:52px;border-radius:16px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:15px;border:1.5px solid rgba(255,255,255,.5)}
.ghost:disabled{opacity:.45}
.slot-result{position:relative;text-align:center;font-size:13px;font-weight:700;margin-top:10px;min-height:17px;opacity:.95}

/* filters */
.filters{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.rating-lbl{font-weight:800;font-size:15px;min-width:118px}
.rating-lbl b{color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--gold) var(--p,0%),var(--card2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:99px;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--card2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:99px;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.presets{display:flex;gap:6px;margin-top:8px}
.presets button{flex:1;height:32px;border-radius:10px;background:var(--card2);font-size:13px;font-weight:700;color:var(--dim)}
.presets button.on{background:var(--ink);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--card2);padding:0 12px;margin-top:12px}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 13px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;scroll-snap-align:start}
.chip small{color:var(--dim);font-weight:600;font-size:12px}
.chip.on{background:var(--ink);color:var(--bg)}
.chip.on small{color:inherit;opacity:.7}

.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px;font-size:13px;color:var(--dim)}
.listhead select{border:0;background:transparent;font-weight:700;color:var(--ink);font-size:13px;text-align:right}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .15s var(--ease)}
.card:active{transform:scale(.98)}
.emo{flex:none;width:52px;height:52px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:28px}
.body{flex:1;min-width:0}
.body h3{margin:0 0 3px;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .open{color:var(--good);font-weight:700}
.meta .closed{color:var(--accent);font-weight:700}
.tags{display:flex;gap:6px;margin-top:5px;font-size:12px}
.tags span{padding:2px 7px;border-radius:99px;background:var(--card2);color:var(--dim);font-weight:700}
.tags .me{background:rgba(245,165,36,.16);color:#b26f00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tags .me{color:var(--gold)}}
:root[data-theme="dark"] .tags .me{color:var(--gold)}
.score{flex:none;text-align:right}
.score b{display:block;font-size:18px;font-weight:900}
.score b i{font-style:normal;color:var(--gold)}
.score small{font-size:12px;color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:40px 20px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.more{width:100%;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;margin-top:6px}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--safe-b) + 20px);width:62px;height:62px;border-radius:22px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:30;transition:transform .15s var(--ease)}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 18px calc(var(--safe-b) + 22px);z-index:50;transform:translateY(105%);transition:transform .38s var(--ease);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.sub{color:var(--dim);font-size:14px;margin-bottom:14px}
.pickflag{display:inline-block;background:var(--accent);color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px;margin-bottom:8px;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-weight:900}
.stat small{font-size:12px;color:var(--dim)}
.btns{display:flex;gap:8px;margin-bottom:16px}
.btn{flex:1;height:48px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5}
.section{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.section h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
.stars{display:flex;gap:4px}
.stars button{font-size:36px;line-height:1;color:var(--line);transition:transform .15s var(--ease),color .15s}
.stars button.on{color:var(--gold)}
.stars button:active{transform:scale(1.25)}
.toggles{display:flex;gap:8px;margin-top:12px}
.toggle{flex:1;height:42px;border-radius:12px;background:var(--card2);font-weight:800;font-size:14px;color:var(--dim)}
.toggle.on{background:var(--ink);color:var(--bg)}
label.f{display:block;font-size:13px;font-weight:700;color:var(--dim);margin:0 0 6px}
.in{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;outline:0;margin-bottom:12px}
.in:focus{border-color:var(--accent)}
textarea.in{height:84px;padding:10px 12px;resize:vertical}
select.in{-webkit-appearance:none;appearance:none}
.hint{font-size:13px;color:var(--dim);margin:-4px 0 12px;line-height:1.45}
.hint a{color:var(--accent)}
.results{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.results button{text-align:left;background:var(--card2);border-radius:12px;padding:10px 12px;font-size:14px}
.results button b{display:block}
.results button.on{outline:2px solid var(--accent)}
.radio{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.radio button{height:36px;padding:0 12px;border-radius:10px;background:var(--card2);font-weight:700;font-size:14px;color:var(--dim)}
.radio button.on{background:var(--ink);color:var(--bg)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;padding:4px 0}
.switchrow small{display:block;color:var(--dim);font-weight:400;font-size:13px}
.sw{flex:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw.on{background:var(--good)}
.sw.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="logo">eat<span>.</span></h1>
      <div class="where">Williamsburg, Brooklyn</div>
    </div>
    <div class="sp"></div>
    <button class="pill" id="syncPill" aria-label="Refresh from Google Maps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span id="syncTxt">Starter list</span>
    </button>
    <button class="iconbtn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="banner"></div>

  <section class="slot" id="slot">
    <div class="slot-top"><span>What are we eating?</span><small id="slotCount"></small></div>
    <div class="reel-win"><div class="reel" id="reel"></div><div class="payline"></div></div>
    <div class="slot-actions">
      <button class="spin" id="spinBtn">SPIN</button>
      <button class="ghost" id="pickBtn" disabled>Pick a spot</button>
    </div>
    <div class="slot-result" id="slotResult"></div>
  </section>

  <section class="filters">
    <div class="row">
      <div class="rating-lbl" id="ratingLbl"></div>
      <input type="range" id="minRating" min="3" max="5" step="0.1" aria-label="Minimum rating">
    </div>
    <div class="presets" id="presets"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, street, dish…" autocomplete="off">
    </div>
  </section>

  <div class="chips" id="chips"></div>

  <div class="seg" id="views">
    <button data-v="all" class="on">All</button>
    <button data-v="fav">Saved</button>
    <button data-v="been">Been</button>
    <button data-v="todo">Not yet</button>
    <button data-v="mine">Added</button>
  </div>

  <div class="listhead">
    <span id="count"></span>
    <select id="sort" aria-label="Sort">
      <option value="rating">Top rated</option>
      <option value="smart">Best + popular</option>
      <option value="reviews">Most reviewed</option>
      <option value="mine">My rating</option>
      <option value="name">A–Z</option>
    </select>
  </div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="Add a restaurant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ---------------- config ---------------- */
const LS = 'eat.v1';
// Williamsburg, roughly: East River to Bushwick, Flushing Ave to McCarren Park.
const BOUNDS = { low:{latitude:40.6990, longitude:-73.9690}, high:{latitude:40.7230, longitude:-73.9330} };
const QUERIES = ['restaurants','pizza','italian restaurant','sushi','ramen','japanese restaurant','mexican restaurant','tacos',
  'thai restaurant','chinese restaurant','korean restaurant','indian restaurant','vietnamese restaurant','mediterranean restaurant',
  'middle eastern restaurant','greek restaurant','french restaurant','spanish tapas','latin american restaurant','american restaurant',
  'new american restaurant','burgers','steakhouse','bbq','seafood','oysters','brunch','breakfast','diner','bakery','cafe',
  'bagels deli','sandwiches','vegan restaurant','dessert','wine bar','cocktail bar with food','caribbean restaurant','african restaurant'];
const FIELDS = ['id','displayName','formattedAddress','shortFormattedAddress','rating','userRatingCount','primaryType',
  'primaryTypeDisplayName','types','priceLevel','googleMapsUri','location','businessStatus','currentOpeningHours.openNow']
  .map(f => 'places.' + f).join(',') + ',nextPageToken';
const FOOD_TYPES = /restaurant|food|cafe|coffee|bakery|bar|pub|diner|deli|meal|bagel|dessert|ice_cream|pizza|sandwich|steak|brunch|breakfast|tea_house|juice|confectionery/;

// genre key -> [label, emoji]; order matters for matching
const GENRES = {
  pizza:['Pizza','🍕'], sushi:['Sushi','🍣'], ramen:['Ramen','🍜'], japanese:['Japanese','🍱'], italian:['Italian','🍝'],
  mexican:['Mexican','🌮'], thai:['Thai','🌶️'], chinese:['Chinese','🥟'], korean:['Korean','🍲'], indian:['Indian','🍛'],

/* ---------------- state ---------------- */
const blank = () => ({ places:{}, mine:{}, s:{ key:'', autoDays:7, useMine:true, showHidden:false, minRating:4.0, genre:'', view:'all', sort:'rating', lastSync:0 } });
let D;
try { D = JSON.parse(localStorage.getItem(LS)) || null; } catch { D = null; }
if (!D) {
  D = blank();
  SEED.forEach(([name, g, addr, rating, price], i) => {
    const id = 'starter-' + i;
    D.places[id] = { id, name, genre:g, address:addr + ', Brooklyn, NY', rating, priceLabel:price, source:'starter' };
  });
}
D.s = Object.assign(blank().s, D.s || {});
const save = () => { try { localStorage.setItem(LS, JSON.stringify(D)); } catch {} };
save();

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
const fmtN = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n);
const ago = t => { if (!t) return ''; const m = (Date.now()-t)/6e4; if (m<1) return 'just now'; if (m<60) return Math.round(m)+'m ago'; const h=m/60; if (h<24) return Math.round(h)+'h ago'; return Math.round(h/24)+'d ago'; };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2200); }
const me = id => D.mine[id] || {};
function setMine(id, patch){ D.mine[id] = Object.assign({}, D.mine[id], patch); save(); }

function genreFromTypes(primary, types){
  const list = [primary, ...(types||[])].filter(Boolean);
  for (const t of list) for (const [re, g] of TYPE_MAP) if (re.test(t)) return g;
  return 'other';
}
const genreOf = p => me(p.id).genre || p.genre || 'other';
const genreInfo = g => GENRES[g] || [g.replace(/(^|_)\w/g, m => m.replace('_',' ').toUpperCase()), '🍽️'];
function score(p){
  const mr = me(p.id).rating;
  if (D.s.useMine && mr) return mr;
  return p.rating ?? mr ?? null;
}

/* ---------------- filtering ---------------- */
function baseList(){
  const min = +D.s.minRating, qq = norm(q), v = D.s.view;
  return Object.values(D.places).filter(p => {
    const m = me(p.id);
    if (m.hidden && !D.s.showHidden) return false;
    if (v === 'fav' && !m.fav) return false;
    if (v === 'been' && !m.been) return false;
    if (v === 'todo' && m.been) return false;
    if (v === 'mine' && p.source !== 'mine') return false;
    if (min > 0) { const s = score(p); if (s == null || s < min) return false; }
    if (qq && !norm(p.name + p.address + genreInfo(genreOf(p))[0] + (m.note||'')).includes(qq)) return false;
    return true;
  });
}
function filtered(){
  const g = D.s.genre, list = baseList().filter(p => !g || genreOf(p) === g);
  const by = D.s.sort, sc = p => score(p) ?? 0, rc = p => p.userRatingCount || 0;
  list.sort((a,b) => {
    if (by === 'name') return a.name.localeCompare(b.name);
    if (by === 'reviews') return rc(b) - rc(a);
    if (by === 'mine') return (me(b.id).rating||0) - (me(a.id).rating||0) || sc(b) - sc(a);
    if (by === 'smart') { // Bayesian-ish: pull low-review places toward 4.2
      const w = p => { const n = rc(p) || (me(p.id).rating ? 5 : 0); return (sc(p)*n + 4.2*50)/(n+50); };
      return w(b) - w(a);
    }
    return sc(b) - sc(a) || rc(b) - rc(a);
  });
  return list;
}
function genreCounts(){
  const c = {};
  baseList().forEach(p => { const g = genreOf(p); c[g] = (c[g]||0) + 1; });
  return Object.entries(c).sort((a,b) => b[1]-a[1]);
}

/* ---------------- render ---------------- */
function renderRating(){
  const v = +D.s.minRating, r = $('#minRating');
  r.value = Math.max(3, v); r.style.setProperty('--p', ((Math.max(3, v)-3)/2*100) + '%');
  $('#ratingLbl').innerHTML = v > 0 ? `<b>★</b> ${v.toFixed(1)}+` : 'Any rating';
  $('#presets').innerHTML = [0,3.5,4,4.3,4.5,4.7].map(x =>
    `<button data-r="${x}" class="${Math.abs(x-v)<.01?'on':''}">${x ? '★ '+x.toFixed(1) : 'Any'}</button>`).join('');
}
function renderChips(){
  const gc = genreCounts(), total = gc.reduce((a,[,n]) => a+n, 0);
  if (D.s.genre && !gc.some(([g]) => g === D.s.genre)) gc.unshift([D.s.genre, 0]);
  $('#chips').innerHTML = `<button class="chip ${D.s.genre?'':'on'}" data-g="">All <small>${total}</small></button>` +
    gc.map(([g,n]) => { const [l,e] = genreInfo(g); return `<button class="chip ${D.s.genre===g?'on':''}" data-g="${esc(g)}">${e} ${esc(l)} <small>${n}</small></button>`; }).join('');
}
function card(p){
  const m = me(p.id), [gl, ge] = genreInfo(genreOf(p)), s = p.rating;
  const meta = [gl, p.priceLabel || PRICE[p.priceLevel], p.openNow === true ? '<span class="open">Open</span>' : p.openNow === false ? '<span class="closed">Closed</span>' : '']
    .filter(Boolean).map(x => x.startsWith('<') ? x : esc(x)).join(' · ');
  const tags = [m.rating ? `<span class="me">You ★ ${m.rating}</span>` : '', m.fav ? '<span>♥ Saved</span>' : '', m.been ? '<span>✓ Been</span>' : '',
    p.source === 'mine' ? '<span>Added by you</span>' : '', m.hidden ? '<span>Hidden</span>' : ''].join('');
  return `<button class="card" data-id="${esc(p.id)}">
    <div class="emo">${ge}</div>
    <div class="body"><h3>${esc(p.name)}</h3><div class="meta">${meta}</div>
      <div class="meta">${esc((p.address||'').replace(/, Brooklyn.*$/,''))}</div>${tags ? `<div class="tags">${tags}</div>` : ''}</div>
    <div class="score">${s != null ? `<b><i>★</i> ${s.toFixed(1)}</b><small>${p.userRatingCount ? fmtN(p.userRatingCount) : p.source==='starter' ? 'approx' : 'Google'}</small>`
      : m.rating ? `<b><i>★</i> ${m.rating}</b><small>yours</small>` : '<small>no rating</small>'}</div>
  </button>`;
}
function renderList(){
  const list = filtered(), n = list.length;
  $('#count').textContent = `${n} place${n===1?'':'s'}` + (D.s.genre ? ` · ${genreInfo(D.s.genre)[0]}` : '');
  if (!n) {
    $('#list').innerHTML = `<div class="empty"><b>🥲</b>Nothing matches.<br>Try a lower rating or another genre.</div>`;
    return;
  }
  $('#list').innerHTML = list.slice(0, shown).map(card).join('') +
    (n > shown ? `<button class="more" id="more">Show ${Math.min(60, n-shown)} more</button>` : '');
}
function renderSync(){
  const pill = $('#syncPill');
  pill.classList.toggle('busy', syncing);
  $('#syncTxt').textContent = syncing ? 'Scanning…' : D.s.lastSync ? 'Updated ' + ago(D.s.lastSync) : D.s.key ? 'Scan now' : 'Starter list';
}
function renderBanner(){
  const b = $('#banner');
  if (syncing) return; // progress banner owns it
  if (!D.s.key && !D.s.dismissIntro) {
    b.innerHTML = `<div class="banner"><div><b>Connect Google Maps</b>You're seeing a starter list. Add a Google Maps API key in settings and eat. will scan every Williamsburg restaurant and keep ratings fresh.<div style="margin-top:8px"><button class="btn dark" style="height:36px;flex:none;padding:0 14px;display:inline-flex" data-act="settings">Set it up</button></div></div><button class="x" data-act="dismiss" aria-label="Dismiss">×</button></div>`;
  } else b.innerHTML = '';
}
function renderAll(){ renderRating(); renderChips(); renderList(); renderSync(); renderBanner(); buildReel(); }

/* ---------------- slot machine ---------------- */
const H = 56;
let reelGenres = [], reelPos = 0, spinning = false;
function buildReel(keepPos){
  if (spinning) return;
  const gc = genreCounts();
  reelGenres = gc.map(([g]) => g);
  $('#slotCount').textContent = reelGenres.length ? `${reelGenres.length} genres · ★ ${(+D.s.minRating).toFixed(1)}+` : '';
  const reel = $('#reel');
  if (!reelGenres.length) { reel.innerHTML = `<div style="transform:translateY(${H}px)">No places</div>`; reel.style.transform=''; return; }
  // shuffle a stable-ish order so the reel doesn't look sorted
  const order = [...reelGenres].sort((a,b) => (hash(a) - hash(b)));
  reelGenres = order;
  const reps = 14;
  reel.innerHTML = Array.from({length:reps}, () => order.map(g => { const [l,e] = genreInfo(g); return `<div><em>${e}</em>${esc(l)}</div>`; }).join('')).join('');
  let idx = D.s.genre ? order.indexOf(D.s.genre) : 0; if (idx < 0) idx = 0;
  idx += order.length; // start in the 2nd lap so there is a row above
  reelPos = idx;
  reel.style.transition = 'none';
  reel.style.transform = `translateY(${-(idx-1)*H}px)`;
  $('#pickBtn').disabled = !filtered().length;
}
function hash(s){ let h = 7; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return h; }
function spin(){
  if (spinning || !reelGenres.length) return;
  const n = reelGenres.length, reel = $('#reel'), slot = $('#slot');
  let target = Math.floor(Math.random() * n);
  if (n > 1 && reelGenres[target] === D.s.genre) target = (target + 1 + Math.floor(Math.random()*(n-1))) % n;
  const finalIdx = n * 11 + target;
  spinning = true; $('#spinBtn').disabled = true; slot.classList.remove('won'); slot.classList.add('spinning');
  $('#slotResult').textContent = '';
  reel.style.transition = 'none';
  reel.style.transform = `translateY(${-(reelPos-1)*H}px)`;
  void reel.offsetHeight;
  const dur = 2600 + Math.random()*700;
  reel.style.transition = `transform ${dur}ms cubic-bezier(.12,.75,.12,1)`;
  reel.style.transform = `translateY(${-(finalIdx-1)*H}px)`;
  let ticks = 0; const tick = setInterval(() => { if (navigator.vibrate) navigator.vibrate(4); if (++ticks > 20) clearInterval(tick); }, 90);
  setTimeout(() => {
    clearInterval(tick);
    spinning = false; $('#spinBtn').disabled = false;
    slot.classList.remove('spinning'); slot.classList.add('won');
    if (navigator.vibrate) navigator.vibrate([30,40,60]);
    const g = reelGenres[target];
    D.s.genre = g; save(); shown = 60;
    reelPos = n + target;
    reel.style.transition = 'none';
    reel.style.transform = `translateY(${-(reelPos-1)*H}px)`;
    renderChips(); renderList();
    const n2 = filtered().length, [l,e] = genreInfo(g);
    $('#slotResult').textContent = `${e} ${l} it is · ${n2} spot${n2===1?'':'s'}`;
    $('#pickBtn').disabled = !n2;
  }, dur + 40);
}
function pickOne(){
  const list = filtered(); if (!list.length) return;
  let pool = list;
  if (list.length > 1 && lastPickId) pool = list.filter(p => p.id !== lastPickId);
  const p = pool[Math.floor(Math.random() * pool.length)];
  lastPickId = p.id;
  openDetail(p.id, true);
}

}
function closeSheet(){
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  document.body.style.overflow = '';
  const f = sheetClose; sheetClose = null; if (f) f();
  renderAll();
}
// swipe down to close
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { sh.style.transition='none'; sh.style.transform=`translateY(${dy}px)`; } }, {passive:true});
  sh.addEventListener('touchend', () => { if (y0 == null) return; sh.style.transition=''; sh.style.transform=''; if (dy > 110) closeSheet(); y0 = null; });
})();

function starsHtml(v, attr='data-star'){ return [1,2,3,4,5].map(i => `<button ${attr}="${i}" class="${i<=v?'on':''}" aria-label="${i} star${i>1?'s':''}">★</button>`).join(''); }
function mapsUrl(p){
  if (p.googleMapsUri) return p.googleMapsUri;
  const qs = encodeURIComponent(p.name + ' ' + (p.address || 'Williamsburg Brooklyn'));
  return `https://www.google.com/maps/search/?api=1&query=${qs}` + (p.source==='google' ? `&query_place_id=${encodeURIComponent(p.id)}` : '');
}
function genreOptions(sel){
  return Object.entries(GENRES).map(([k,[l,e]]) => `<option value="${k}" ${k===sel?'selected':''}>${e} ${l}</option>`).join('');
}

    <div class="section">

  const sh = $('#sheet');

    if (navigator.vibrate) navigator.vibrate(8);
  };
  sh.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    const k = b.dataset.tog; setMine(id, {[k]: !me(id)[k]}); b.classList.toggle('on', !!me(id)[k]);
  });
  sh.querySelector('#note').oninput = e => setMine(id, {note: e.target.value});
  sh.querySelector('#genreSel').onchange = e => setMine(id, {genre: e.target.value});
  sh.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === 'close') closeSheet();
    else if (a === 'repick') pickOne();
    else if (a === 'respin') { closeSheet(); window.scrollTo({top:0,behavior:'smooth'}); setTimeout(spin, 350); }
    else if (a === 'hide') { setMine(id, {hidden: !me(id).hidden}); toast(me(id).hidden ? 'Hidden' : 'Back in the list'); closeSheet(); }
    else if (a === 'delete') { if (confirm(`Delete ${p.name}?`)) { delete D.places[id]; delete D.mine[id]; save(); toast('Deleted'); closeSheet(); } }
  });
}

function openAdd(){
  let rating = 0, picked = null;
  openSheet(`
    <h2>Add a place</h2>
    <div class="sub">Somewhere you love that's missing? Add it and rate it.</div>
    <label class="f" for="aName">Name</label>
    <input class="in" id="aName" placeholder="e.g. Grandma's Dumplings" autocomplete="off">
    ${D.s.key ? '<button class="btn" id="aLookup" style="width:100%;margin:-2px 0 12px">🔎 Find it on Google Maps</button><div class="results" id="aResults"></div>' : ''}
    <label class="f" for="aGenre">Genre</label>
    <select class="in" id="aGenre">${genreOptions('other')}</select>
    <label class="f" for="aAddr">Address</label>
    <input class="in" id="aAddr" placeholder="123 Bedford Ave" autocomplete="off">
    <label class="f">Your rating</label>
    <div class="stars" id="aStars" style="margin-bottom:14px">${starsHtml(0)}</div>
    <label class="f" for="aNote">Notes</label>
    <textarea class="in" id="aNote" placeholder="Must order: …"></textarea>
    <div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="aSave">Add to eat.</button></div>`);
  const sh = $('#sheet');
  sh.querySelector('#aStars').onclick = e => { const b = e.target.closest('[data-star]'); if (!b) return; rating = +b.dataset.star === rating ? 0 : +b.dataset.star; sh.querySelectorAll('#aStars button').forEach(x => x.classList.toggle('on', +x.dataset.star <= rating)); };
  sh.querySelector('[data-act="close"]').onclick = closeSheet;
  const lk = sh.querySelector('#aLookup');
  if (lk) lk.onclick = async () => {
    const name = sh.querySelector('#aName').value.trim(); if (!name) { toast('Type a name first'); return; }
    lk.disabled = true; lk.textContent = 'Searching…';
    try {
      const r = await searchText(name + ' Williamsburg Brooklyn', null, false);
      const res = (r.places || []).map(fromGoogle).filter(Boolean).slice(0, 5);
      const box = sh.querySelector('#aResults');
      box.innerHTML = res.length ? res.map((p,i) => `<button data-i="${i}"><b>${esc(p.name)}</b>${p.rating!=null?'★ '+p.rating.toFixed(1)+' · ':''}${esc(p.address)}</button>`).join('') : '<div class="hint">No match on Google Maps. Fill it in by hand.</div>';
      box.onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; picked = res[+b.dataset.i];
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        sh.querySelector('#aName').value = picked.name; sh.querySelector('#aAddr').value = picked.address; sh.querySelector('#aGenre').value = GENRES[picked.genre] ? picked.genre : 'other'; };
    } catch (err) { toast(err.message); }
    lk.disabled = false; lk.textContent = '🔎 Find it on Google Maps';
  };
  sh.querySelector('#aSave').onclick = () => {
    const name = sh.querySelector('#aName').value.trim();
    if (!name) { sh.querySelector('#aName').focus(); toast('Give it a name'); return; }
    const g = sh.querySelector('#aGenre').value, addr = sh.querySelector('#aAddr').value.trim(), note = sh.querySelector('#aNote').value.trim();
    let id;
    if (picked && picked.name === name) { id = picked.id; D.places[id] = Object.assign(D.places[id] || {}, picked); }
    else { id = 'mine-' + Date.now().toString(36); D.places[id] = { id, name, genre:g, address: addr ? (/brooklyn/i.test(addr) ? addr : addr + ', Brooklyn, NY') : '', source:'mine', added:Date.now() }; }
    setMine(id, { rating: rating || undefined, note: note || undefined, genre: g !== (D.places[id].genre||'other') ? g : undefined, been: rating ? true : undefined });
    D.s.genre = ''; D.s.view = 'all'; save(); $('#views').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === 'all'));
    toast(`${name} added`); closeSheet();
  };
  setTimeout(() => sh.querySelector('#aName').focus(), 350);
}

function openSettings(){
  const s = D.s, counts = Object.values(D.places).reduce((a,p) => (a[p.source]=(a[p.source]||0)+1, a), {});
  const rated = Object.values(D.mine).filter(m => m.rating).length;
  openSheet(`
    <h2>Settings</h2>
    <div class="sub">${counts.google||0} from Google Maps · ${counts.mine||0} added by you · ${rated} rated${counts.starter?` · ${counts.starter} starter`:''}</div>
    <div class="section">
      <h4>Google Maps</h4>
      <label class="f" for="sKey">Places API key</label>
      <input class="in" id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…" value="${esc(s.key)}">
      <div class="hint">Stays on this phone only. Create one in Google Cloud: enable <b>Places API (New)</b>, then make an API key restricted to this site's address. Each full scan is about 100 searches, which fits inside Google's monthly free allowance at weekly refreshes.</div>
      <label class="f">Auto refresh</label>
      <div class="radio" id="sAuto">${[[0,'Off'],[1,'Daily'],[3,'Every 3 days'],[7,'Weekly'],[30,'Monthly']].map(([d,l]) => `<button data-d="${d}" class="${+s.autoDays===d?'on':''}">${l}</button>`).join('')}</div>
      <button class="btn primary" id="sScan" style="width:100%" ${syncing?'disabled':''}>${syncing?'Scanning…':'Scan Williamsburg now'}</button>
      <div class="hint" style="margin:10px 0 0">${s.lastSync ? 'Last scan ' + ago(s.lastSync) + '.' : 'Not scanned yet.'}</div>
    </div>
    <div class="section">
      <div class="switchrow"><span>Filter by my rating<small>When you've rated a place, your stars count instead of Google's.</small></span><button class="sw ${s.useMine?'on':''}" data-sw="useMine" aria-label="Filter by my rating"></button></div>
      <div class="switchrow" style="margin-top:10px"><span>Show hidden places</span><button class="sw ${s.showHidden?'on':''}" data-sw="showHidden" aria-label="Show hidden places"></button></div>
    </div>
    <div class="section">
      <h4>Your data</h4>
      <div class="hint">Your ratings, notes and added places live on this device. Back them up now and then.</div>
      <div class="btns" style="margin:0"><button class="btn" id="sExport">Export</button><button class="btn" id="sImport">Import</button></div>
      <input type="file" id="sFile" accept="application/json,.json" class="hidden">
    </div>
    <div class="btns"><button class="btn danger" id="sReset">Reset app</button><button class="btn dark" data-act="close">Done</button></div>`);
  const sh = $('#sheet');
  const keyIn = sh.querySelector('#sKey');
  keyIn.onchange = () => { D.s.key = keyIn.value.trim(); save(); };
  sh.querySelector('#sAuto').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; D.s.autoDays = +b.dataset.d; save(); sh.querySelectorAll('#sAuto button').forEach(x => x.classList.toggle('on', x === b)); };
  sh.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { const k = b.dataset.sw; D.s[k] = !D.s[k]; save(); b.classList.toggle('on', D.s[k]); });
  sh.querySelector('#sScan').onclick = () => { D.s.key = keyIn.value.trim(); save(); if (!D.s.key) { toast('Paste your API key first'); keyIn.focus(); return; } closeSheet(); runSync(true); };
  sh.querySelector('#sExport').onclick = () => {
    const blob = new Blob([JSON.stringify({ app:'eat', v:1, exported:new Date().toISOString(), mine:D.mine,
      added:Object.values(D.places).filter(p => p.source === 'mine') }, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `eat-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  sh.querySelector('#sImport').onclick = () => sh.querySelector('#sFile').click();
  sh.querySelector('#sFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (j.app !== 'eat') throw new Error('Not an eat. backup');
      (j.added || []).forEach(p => { D.places[p.id] = p; });
      Object.entries(j.mine || {}).forEach(([id, m]) => { D.mine[id] = Object.assign({}, D.mine[id], m); });
      save(); toast('Backup restored'); closeSheet();
    } catch (err) { toast(err.message || 'Could not read that file'); }
  };
  sh.querySelector('#sReset').onclick = () => { if (confirm('Erase everything, including your ratings and added places?')) { localStorage.removeItem(LS); location.reload(); } };
  sh.querySelector('[data-act="close"]').onclick = closeSheet;
}

/* ---------------- Google Places sync ---------------- */
async function searchText(textQuery, pageToken, restrict = true){
  const body = { textQuery, pageSize:20 };
  if (restrict) body.locationRestriction = { rectangle: BOUNDS };
  else body.locationBias = { rectangle: BOUNDS };
  if (pageToken) body.pageToken = pageToken;
  let res;
  try {
    res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Goog-Api-Key':D.s.key, 'X-Goog-FieldMask':FIELDS }, body:JSON.stringify(body)
    });
  } catch { throw new Error('No connection to Google Maps'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error?.message || `Google Maps error ${res.status}`);
  return j;
}
function fromGoogle(g){
  if (!g || !g.id || g.businessStatus === 'CLOSED_PERMANENTLY') return null;
  const types = g.types || [];
  if (!FOOD_TYPES.test([g.primaryType, ...types].join(' '))) return null;
  return {
    id:g.id, name:g.displayName?.text || 'Unnamed', address:g.formattedAddress || '', short:g.shortFormattedAddress,
    rating:g.rating ?? null, userRatingCount:g.userRatingCount || 0, priceLevel:g.priceLevel, primaryType:g.primaryType,
    typeLabel:g.primaryTypeDisplayName?.text, genre:genreFromTypes(g.primaryType, types), googleMapsUri:g.googleMapsUri,
    location:g.location, openNow:g.currentOpeningHours?.openNow, source:'google', updated:Date.now()
  };
}
function setProgress(label, frac, found){
  $('#banner').innerHTML = `<div class="banner"><div style="flex:1"><b>Scanning Google Maps…</b>${esc(label)} · ${found} places<div class="progress"><i style="width:${Math.round(frac*100)}%"></i></div></div></div>`;
}
async function runSync(manual){
  if (syncing || !D.s.key) return;
  syncing = true; renderSync();
  const found = {};
  try {
    for (let i = 0; i < QUERIES.length; i++) {
      let token = null, page = 0;
      do {
        setProgress(QUERIES[i], i / QUERIES.length, Object.keys(found).length);
        const r = await searchText(QUERIES[i], token);
        (r.places || []).forEach(g => { const p = fromGoogle(g); if (p) found[p.id] = p; });
        token = r.nextPageToken; page++;
      } while (token && page < 3);
    }
    const ids = Object.keys(found);
    if (!ids.length) throw new Error('Google returned no places. Check that Places API (New) is enabled for this key.');
    // carry starter ratings/notes over to the matching Google place, then drop the starter list
    const byName = {}; ids.forEach(id => { byName[norm(found[id].name)] = id; });
    Object.values(D.places).filter(p => p.source === 'starter').forEach(p => {
      const gid = byName[norm(p.name)];
      const m = D.mine[p.id], used = m && (m.rating || m.fav || m.been || m.note || m.genre);
      if (gid) { if (m) D.mine[gid] = Object.assign({}, m, D.mine[gid]); delete D.mine[p.id]; delete D.places[p.id]; }
      else if (used) p.source = 'mine'; // keep places you've touched, as your own
      else { delete D.mine[p.id]; delete D.places[p.id]; }
    });
    ids.forEach(id => { D.places[id] = Object.assign({}, D.places[id], found[id]); });
    // Google places not seen in this scan for 3+ scans are dropped (likely closed), unless you rated/saved them
    Object.values(D.places).forEach(p => {
      if (p.source !== 'google' || found[p.id]) return;
      p.missed = (p.missed || 0) + 1;
      const m = D.mine[p.id];
      if (p.missed >= 3 && !(m && (m.rating || m.fav || m.note))) delete D.places[p.id];
    });
    ids.forEach(id => { delete D.places[id].missed; });
    D.s.lastSync = Date.now(); save();
    toast(`${ids.length} Williamsburg spots loaded`);
  } catch (err) {
    syncing = false;
    $('#banner').innerHTML = `<div class="banner err"><div><b>Scan stopped</b>${esc(err.message)}</div><button class="x" data-act="clearbanner" aria-label="Dismiss">×</button></div>`;
    renderSync();
    if (manual) toast('Scan failed');
    return;
  }
  syncing = false; $('#banner').innerHTML = ''; shown = 60; renderAll();
}
function maybeAutoSync(){
  if (!D.s.key || !D.s.autoDays || syncing) return;
  if (Date.now() - (D.s.lastSync || 0) > D.s.autoDays * 864e5) runSync(false);
}

/* ---------------- events ---------------- */
$('#minRating').addEventListener('input', e => { D.s.minRating = +e.target.value <= 3 ? 0 : +e.target.value; shown = 60; save(); renderRating(); renderChips(); renderList(); });
$('#minRating').addEventListener('change', () => buildReel());
$('#presets').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; D.s.minRating = +b.dataset.r; shown = 60; save(); renderAll(); };
$('#q').addEventListener('input', e => { q = e.target.value; shown = 60; renderChips(); renderList(); clearTimeout(buildReel.t); buildReel.t = setTimeout(buildReel, 300); });
$('#chips').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; D.s.genre = D.s.genre === b.dataset.g ? '' : b.dataset.g; shown = 60; save(); $('#slotResult').textContent=''; renderChips(); renderList(); buildReel(); };
$('#views').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; D.s.view = b.dataset.v; shown = 60; save(); $('#views').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); renderChips(); renderList(); buildReel(); };
$('#sort').onchange = e => { D.s.sort = e.target.value; save(); renderList(); };
$('#list').onclick = e => {
  if (e.target.id === 'more') { shown += 60; renderList(); return; }
  const c = e.target.closest('.card'); if (c) openDetail(c.dataset.id);
};
$('#spinBtn').onclick = spin;
$('#pickBtn').onclick = pickOne;
$('#addBtn').onclick = openAdd;
$('#openSettings').onclick = openSettings;
$('#syncPill').onclick = () => D.s.key ? runSync(true) : openSettings();
$('#scrim').onclick = closeSheet;
$('#banner').onclick = e => {
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'settings') openSettings();
  if (a === 'dismiss') { D.s.dismissIntro = true; save(); renderBanner(); }
  if (a === 'clearbanner') renderBanner();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet').classList.contains('on')) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderSync(); maybeAutoSync(); } });
setInterval(renderSync, 60000);

// init
$('#sort').value = D.s.sort;
$('#views').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === D.s.view));
renderAll();
maybeAutoSync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
